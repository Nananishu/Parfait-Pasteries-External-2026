<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="rounded">
      <rect x="20" y="20" width="1160" height="460" rx="24" ry="24"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="#FDF5F6" />
  <!-- scallop border: repeated circles along edge -->
  <g fill="#F4CCD6">
    <!-- top row -->
    <g transform="translate(0,0)">
      <circle cx="40" cy="20" r="20"/>
      <circle cx="120" cy="20" r="20"/>
      <circle cx="200" cy="20" r="20"/>
      <circle cx="280" cy="20" r="20"/>
      <circle cx="360" cy="20" r="20"/>
      <circle cx="440" cy="20" r="20"/>
      <circle cx="520" cy="20" r="20"/>
      <circle cx="600" cy="20" r="20"/>
      <circle cx="680" cy="20" r="20"/>
      <circle cx="760" cy="20" r="20"/>
      <circle cx="840" cy="20" r="20"/>
      <circle cx="920" cy="20" r="20"/>
      <circle cx="1000" cy="20" r="20"/>
      <circle cx="1080" cy="20" r="20"/>
    </g>
    <!-- bottom row -->
    <g transform="translate(0,460)">
      <circle cx="40" cy="20" r="20"/>
      <circle cx="120" cy="20" r="20"/>
      <circle cx="200" cy="20" r="20"/>
      <circle cx="280" cy="20" r="20"/>
      <circle cx="360" cy="20" r="20"/>
      <circle cx="440" cy="20" r="20"/>
      <circle cx="520" cy="20" r="20"/>
      <circle cx="600" cy="20" r="20"/>
      <circle cx="680" cy="20" r="20"/>
      <circle cx="760" cy="20" r="20"/>
      <circle cx="840" cy="20" r="20"/>
      <circle cx="920" cy="20" r="20"/>
      <circle cx="1000" cy="20" r="20"/>
      <circle cx="1080" cy="20" r="20"/>
    </g>
  </g>
  <!-- side scallops -->
  <g fill="#F4CCD6">
    <g transform="translate(0,0)">
      <circle cx="20" cy="60" r="20"/>
      <circle cx="20" cy="140" r="20"/>
      <circle cx="20" cy="220" r="20"/>
      <circle cx="20" cy="300" r="20"/>
      <circle cx="20" cy="380" r="20"/>
    </g>
    <g transform="translate(1160,0)">
      <circle cx="20" cy="60" r="20"/>
      <circle cx="20" cy="140" r="20"/>
      <circle cx="20" cy="220" r="20"/>
      <circle cx="20" cy="300" r="20"/>
      <circle cx="20" cy="380" r="20"/>
    </g>
  </g>
  <rect x="40" y="40" width="1120" height="420" fill="#FFF" rx="12" ry="12"/>
</svg>