<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts used by the design -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Parfait Pasteries</title>
</head>
<body>

<!-- This is the main shared layout for the whole site, so each page can reuse the same header and footer. -->
<header class="site-header">
    <div class="header-inner" style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;">
        <a href="/" class="home-icon">🏠</a>
        <div class="header-icons" style="display:flex;gap:14px;align-items:center;">
            <a href="#">🎂</a>
            <a href="#">✉</a>
            <a href="#">🛒</a>
            <a href="#">☰</a>
        </div>
    </div>
</header>

<main>
    <!-- This block is where each page inserts its own content, such as the homepage or addons page. -->
    {% block content %}{% endblock %}
</main>

<footer style="padding:30px 20px;text-align:center;color:#999;font-size:0.9rem;">
    © {{ current_year if current_year is defined else "" }} Parfait Pasteries
</footer>

</body>
</html>
