<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts used by the design -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Parfait Pasteries</title>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="{{ url_for('index') }}" class="header-icon" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5 10.5V20h14V10.5"></path>
            </svg>
        </a>
        <div class="header-icons">
            <a href="{{ url_for('best_sellers_page') }}" class="header-icon" aria-label="Best Sellers">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 10h16"></path>
                    <path d="M6 10v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"></path>
                    <path d="M8 10V7a2 2 0 0 1 4 0v3"></path>
                    <path d="M12 10V6a2 2 0 0 1 4 0v4"></path>
                    <path d="M16 10V8a2 2 0 0 1 4 0v2"></path>
                </svg>
            </a>
            <a href="{{ url_for('feedback_page') }}" class="header-icon" aria-label="Email">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h16v12H4z"></path>
                    <path d="M4 8l8 6 8-6"></path>
                </svg>
            </a>
            <a href="{{ url_for('addons_page') }}" class="header-icon" aria-label="Cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="20" r="1"></circle>
                    <circle cx="18" cy="20" r="1"></circle>
                    <path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L18 7H6"></path>
                </svg>
            </a>
            <a href="#" class="header-icon" aria-label="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </a>
        </div>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer style="padding:30px 20px;text-align:center;color:#999;font-size:0.9rem;">
    © {{ current_year if current_year is defined else "" }} Parfait Pasteries
</footer>

</body>
</html>
